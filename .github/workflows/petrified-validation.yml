name: Petrified validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/petrified/**'
      - 'training/points_head/**'
      - 'CMakeLists.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/petrified-validation.yml'
permissions:
  contents: read
jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure rules and engine
        # Python's hosted Windows distribution has no python312_d.lib. The
        # release wheel below builds the binding with the available Python ABI.
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DPETRIFIED_PYTHON=OFF
      - name: Build
        run: cmake --build build/native --config ${{ matrix.config }} -j2
      - name: State invariants without external weights
        run: ctest --test-dir build/native -C ${{ matrix.config }} --output-on-failure
      - name: Points panel stopping contract (synthetic outcomes)
        run: python tests/petrified/points_panel_test.py
      - name: Build isolated Python wheel
        if: matrix.config == 'Release'
        run: python -m pip wheel . --no-deps --wheel-dir build/wheels
      - name: Chess.com scoring fixtures through isolated Python and UCI
        if: matrix.config == 'Release'
        shell: bash
        run: |
          python -m pip install --no-deps --target build/points-module build/wheels/*.whl
          if [ "$RUNNER_OS" = Windows ]; then ENGINE=build/native/Release/petrified-stockfish.exe; else ENGINE=build/native/petrified-stockfish; fi
          python tests/petrified/points.py --module-dir build/points-module --engine "$ENGINE"
      - uses: actions/upload-artifact@v4
        if: matrix.config == 'Release'
        with:
          name: python-${{ matrix.os }}
          path: build/wheels/*
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DPETRIFIED_SANITIZERS=ON
      - run: cmake --build build/asan -j2
      - run: ctest --test-dir build/asan --output-on-failure
